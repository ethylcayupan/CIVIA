<style>
:root{--bg:#fff;--tx:#0a2540;--card:#fff;--line:#bcd0e0;--mut:#4a5b6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif}
header{padding:16px 16px 4px;max-width:1000px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
header p{margin:0;font-size:13px;color:var(--mut)}
nav,.dv{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 4px;max-width:1000px;margin:0 auto}
nav{padding-bottom:12px}
nav button,.dv button{font:500 13px Poppins,system-ui,sans-serif;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
nav button[aria-selected="true"],.dv button[aria-selected="true"]{background:#0B3D91;color:#fff;border-color:#0B3D91}

[data-go],[data-lang]{cursor:pointer}

.sb{width:210px;background:var(--p);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:4px;flex:none}
.sb b{font-size:20px;margin-bottom:14px;padding-left:10px}
.sb a{padding:10px 12px;border-radius:12px;opacity:.9}
.sb a.on{background:rgba(255,255,255,.2);font-weight:600;opacity:1}
.mn{flex:1;padding:20px 26px;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;overflow-y:auto}
.tb{display:flex;justify-content:space-between;align-items:center}
.tb h2{margin:0;font-size:24px}
.pl span{border:1px solid var(--p);border-radius:999px;padding:3px 10px;font-size:12px;margin-left:6px;color:var(--p)}
.sub{color:var(--m);margin:0}
.card{background:var(--c);border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(10,37,64,.07)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.g2w{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.btn{display:inline-block;background:var(--p);color:#fff;border-radius:999px;padding:11px 22px;font-weight:600;text-align:center}

.in{background:#fff;border:1px solid #bcd0e0;border-radius:12px;padding:11px 14px;margin:4px 0 10px;color:var(--m)}
label{font-size:13px;font-weight:600}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}

.bar{height:10px;background:#cfe3f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:60%;background:var(--s)}
.rq{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e1ecf5}
.bub{padding:10px 14px;border-radius:16px;max-width:60%}
.bub.a{background:#fff}.bub.u{background:var(--s);color:#0A2540;align-self:flex-end}
.sw{width:46px;height:26px;border-radius:99px;background:var(--s);position:relative;display:inline-block;flex:none}

.otp{display:flex;gap:10px;justify-content:center;margin:14px 0}.otp i{width:50px;height:60px;background:#fff;border:2px solid var(--s);border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:700}

.md{position:relative;background:#fff;color:#0A2540;border-radius:20px;padding:24px 26px 20px;box-shadow:0 12px 40px rgba(10,37,64,.35)}
.md.w1{width:430px;max-width:92%}.md.w2{width:580px;max-width:92%}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:#E8F6FF;color:#0B3D91;display:grid;place-items:center;font-weight:700;font-size:16px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:2px solid #bcd0e0;border-radius:999px;padding:10px 20px;font-weight:600;color:#0A2540}
.gbtn i{width:24px;height:24px;border-radius:50%;background:#E8F6FF;color:#0B3D91;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.or{display:flex;align-items:center;gap:10px;color:var(--m);font-size:12px;margin:10px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:#bcd0e0}
.fr2{display:flex;gap:10px}
.seg{display:flex;background:#E8F6FF;border-radius:999px;padding:4px;margin:0 0 12px}.seg span{flex:1;text-align:center;padding:8px 10px;border-radius:999px;font-weight:600;font-size:14px;color:var(--m)}.seg span.on{background:#0B3D91;color:#fff}
u{text-decoration:underline;color:var(--p);font-weight:600}
.zone{border:2px dashed var(--s);border-radius:14px;padding:18px;text-align:center;color:var(--m)}
.th{width:54px;height:40px;border-radius:8px;background:linear-gradient(135deg,#cfe3f3,#e8f6ff);border:1px solid #bcd0e0;flex:none}
.cb{width:20px;height:20px;border:2px solid var(--p);border-radius:5px;flex:none;margin-top:2px}
.rh{margin:14px 0 2px;font-size:13px;color:var(--p)}
.ri{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #e1ecf5}
.st{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.st i{width:26px;height:26px;border-radius:50%;background:var(--t);color:#0A2540;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.land{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;color:#fff;position:relative}

.row2{display:flex;gap:14px;align-items:center}
.hero2{flex:1;padding:30px 60px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero2 h2{font-size:52px;margin:0;line-height:1.1}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 60px 40px}
.strip .card{color:#0A2540}
.ph{position:absolute;right:20px;bottom:10px;font-size:11px;opacity:.8}
.stt{display:flex;gap:6px;padding:0;margin:0;max-width:none}
.f.m{flex-direction:column;font-size:14px}
.hb{display:none}
.m .sb{width:auto;flex-wrap:wrap;flex-direction:row;align-items:center;justify-content:space-between;padding:14px 16px}

.m .tb{flex-direction:column;align-items:flex-start;gap:10px}
.m .tb h2{font-size:20px}
.m .pl{display:flex;flex-wrap:wrap;gap:6px}
.m .pl span{margin:0}
.m .g3,.m .g2,.m .g2w{grid-template-columns:1fr}
.m .bub{max-width:88%}
.m .rq{flex-wrap:wrap;gap:6px}
.m .otp{gap:6px}.m .otp i{width:40px;height:52px}
.m .ov{place-items:start center;padding:14px 0;overflow-y:auto;scrollbar-width:none}.m .ov::-webkit-scrollbar{display:none}.m .ov>.md{margin:auto}
.m .md,.m .md.w1,.m .md.w2{width:92%;padding:22px 18px 18px}
.m .fr2{flex-direction:column;gap:0}
.m .tb2{padding:14px 16px}
.m .tb2 .row2{gap:8px}.m .tb2 .row2 span:not(.btn){display:none}
.m .tb2 .btn{padding:8px 14px;font-size:13px}
.m .hero2{padding:24px 18px}.m .hero2 h2{font-size:32px}.m .hero2 .row2{flex-wrap:wrap}
.m .strip{grid-template-columns:1fr;padding:0 18px 30px}
.m [style*="font-size:64px"]{font-size:46px!important;letter-spacing:5px!important}
.m .ph{position:static;padding:0 18px 12px}
.flag{background:#fdeeee;border:2px solid #d65a5a;border-radius:14px;padding:12px 14px}
.flag h4{margin:0 0 6px;font-size:15px;color:#a02525}
.cmp{display:grid;grid-template-columns:.8fr 1.1fr 1.1fr;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;margin:8px 0}
.cmp>div{padding:7px 10px;border-bottom:1px solid #e1ecf5}
.cmp .h{background:#f1f6fb;font-weight:600;color:var(--mut)}
.cmp .bad{background:#fbe3e3;color:#a02525;font-weight:700}
.cmp .good{color:#0a6b5c;font-weight:600}
.dt{display:flex;gap:10px}.dt .in{flex:1;margin-bottom:6px}

.hint{font-size:12px;color:#4a5b6e;margin:0 0 10px}
.m .cmp{grid-template-columns:1fr}.m .cmp .h{display:none}.m .cmp>div{border-bottom:0;padding:4px 10px}.m .cmp>div:nth-child(3n+4){padding-top:10px;font-weight:700;color:#0a2540}

#top{display:none}
#wr{margin:16px auto}
input.in{display:block;width:100%;font:inherit;color:#0a2540;outline:0}
input.in:focus{border-color:#0B3D91;box-shadow:0 0 0 3px rgba(59,167,242,.3)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0a2540;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
</style>
